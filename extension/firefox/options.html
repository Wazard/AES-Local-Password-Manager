<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #292929; color: #98B1BD;
      padding: 16px; width: 320px;
    }
    h1 { font-size: 15px; color: #F2F4F5; margin-top: 0; }
    label { display: block; font-size: 12px; font-weight: 600; margin: 12px 0 4px; }
    input {
      width: 100%; box-sizing: border-box;
      background: #363738; color: #F2F4F5;
      border: 1px solid #43443F; border-radius: 6px;
      padding: 8px; font-family: "Courier New", monospace;
    }
    button {
      margin-top: 16px; background: #66769C; color: #F2F4F5;
      border: none; border-radius: 6px; padding: 8px 16px; cursor: pointer;
    }
    button:hover { background: #56638A; }
    #status { font-size: 12px; color: #C7A862; margin-top: 10px; min-height: 14px; }
    p.hint { font-size: 11px; color: #C2AEBB; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>Secure Vault pairing</h1>
  <p class="hint">Open the Secure Vault app → ⚙ Extension screen, then copy the values here.</p>
  <label for="port">Port</label>
  <input id="port" type="text" placeholder="8765">
  <label for="token">Pairing token</label>
  <input id="token" type="text" placeholder="paste token">
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
