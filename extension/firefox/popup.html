<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 12px;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #292929;
      color: #98B1BD;
    }
    h1 { font-size: 14px; margin: 0 0 10px; color: #F2F4F5; }
    .msg { font-size: 13px; line-height: 1.4; color: #C2AEBB; }
    .match {
      display: flex; flex-direction: column;
      width: 100%; text-align: left;
      background: #363738; color: #F2F4F5;
      border: none; border-radius: 8px;
      padding: 8px 10px; margin-bottom: 6px; cursor: pointer;
    }
    .match:hover { background: #43443F; }
    .match .name { font-weight: 600; }
    .match .user { font-size: 11px; color: #98B1BD; }
    button.link {
      background: none; border: none; color: #66769C;
      cursor: pointer; padding: 0; font-size: 12px; text-decoration: underline;
    }
    .err { color: #C7A862; }
    .foot {
      margin-top: 12px; padding-top: 10px; border-top: 1px solid #43443F;
      font-size: 12px;
    }
    .foot label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #F2F4F5; }
    .disclosure { font-size: 11px; color: #7E8C93; margin-top: 6px; line-height: 1.35; }
  </style>
</head>
<body>
  <h1>Secure Vault</h1>
  <div id="content" class="msg">Loading…</div>
  <div class="foot">
    <label><input type="checkbox" id="mute"> Mute suggestions</label>
    <div class="disclosure">Mute only works for the current session. If you want
      a permanent mute, disable the extension — it's a password manager, so if
      you don't intend to use it you have no business having it on.</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
