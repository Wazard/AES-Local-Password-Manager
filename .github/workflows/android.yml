name: Android app

on:
  push:
    paths: ["android/**", "core/**", "UI/palette.json", "ios/SecureVaultTests/Fixtures/**", "ios/tools/**",
            ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "core/**", "UI/palette.json", "ios/SecureVaultTests/Fixtures/**", "ios/tools/**",
            ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No wrapper jar in the repository: CI uses a pinned Gradle instead.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests (JVM) — they open vaults written by the desktop's own code
        run: |
          mkdir -p build/export
          SV_EXPORT_DIR="$PWD/build/export" gradle --no-daemon :app:testDebugUnitTest

      - name: The desktop code reads what Android wrote
        run: |
          python3 -m venv build/venv
          build/venv/bin/pip install -q argon2-cffi cryptography
          build/venv/bin/python ../ios/tools/check_roundtrip.py build/export/roundtrip.pwmanager "Added on Android"
          build/venv/bin/python ../ios/tools/check_sync.py build/export "Added on Android" "Test Android"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SV_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so this APK is signed with a throwaway debug key. A later build can't be installed over it without uninstalling first, which deletes a vault stored in the app. See android/README.md."
          fi

      - name: Build the APK
        env:
          SV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SV_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' ../core/version.py)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          gradle --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "build/SecureVault-$version.apk"
          ls -l build/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SecureVault-${{ env.VERSION }}-apk
          path: android/build/SecureVault-*.apk
          if-no-files-found: error
