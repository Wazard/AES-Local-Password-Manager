name: iOS app

on:
  push:
    paths: ["ios/**", "core/**", "UI/palette.json", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "core/**", "UI/palette.json", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Unit tests (simulator)
        run: |
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Simulator: $udid"
          mkdir -p build/export
          TEST_RUNNER_SV_EXPORT_DIR="$PWD/build/export" xcodebuild test -quiet \
            -project SecureVault.xcodeproj -scheme SecureVault \
            -destination "id=$udid" CODE_SIGNING_ALLOWED=NO

      - name: The desktop code reads what iOS wrote
        run: |
          python3 -m venv build/venv
          build/venv/bin/pip install -q argon2-cffi cryptography
          build/venv/bin/python tools/check_roundtrip.py build/export/roundtrip.pwmanager

      - name: Build the unsigned .ipa
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' ../core/version.py)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          xcodebuild archive -quiet \
            -project SecureVault.xcodeproj -scheme SecureVault -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/SecureVault.xcarchive \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p build/ipa/Payload
          cp -R build/SecureVault.xcarchive/Products/Applications/SecureVault.app build/ipa/Payload/
          (cd build/ipa && zip -qry "../SecureVault-$version.ipa" Payload)
          ls -l build/*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SecureVault-${{ env.VERSION }}-ipa
          path: ios/build/SecureVault-*.ipa
          if-no-files-found: error
